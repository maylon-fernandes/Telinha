<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000" />
  <title>Screen</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <div id="screen-wrapper" class="screen hidden">
      <video id="screen-video" autoplay playsinline muted></video>
      <div id="live-badge" class="live-badge hidden">
        <span class="dot"></span> LIVE <span id="badge-timer">00:00</span>
      </div>
      <div id="viewer-controls" class="viewer-controls hidden">
        <div id="viewer-status" class="viewer-status-label hidden">
          <span class="spinner"></span> Conectando...
        </div>
        <div class="ctrl-buttons">
          <button id="volume-btn" class="ctrl-btn" title="Volume">🔊</button>
          <input id="volume-slider" type="range" min="0" max="100" value="90" class="volume-slider" />
          <button id="fullscreen-btn" class="ctrl-btn" title="Tela cheia">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square">
              <path d="M3 8V5a2 2 0 0 1 2-2h3" /><path d="M16 3h3a2 2 0 0 1 2 2v3" />
              <path d="M21 16v3a2 2 0 0 1-2 2h-3" /><path d="M8 21H5a2 2 0 0 1-2-2v-3" />
            </svg>
          </button>
          <button id="leave-btn" class="ctrl-btn leave" title="Sair">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square">
              <path d="M18 6L6 18" /><path d="M6 6l12 12" />
            </svg>
          </button>
        </div>
      </div>
    </div>

    <div id="ui">
      <div class="panel" id="broadcaster-panel">
        <div class="brand">
          <h1>SCREEN</h1>
        </div>
        <p class="subtitle">// compartilhe sua tela em tempo real</p>

        <div class="btn-group">
          <button id="start-share-btn" class="btn primary">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
              <path d="M8 5v14l11-7z" />
            </svg>
            INICIAR
          </button>
          <button id="stop-share-btn" class="btn danger hidden">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
              <rect x="6" y="6" width="12" height="12" />
            </svg>
            PARAR
          </button>
        </div>

        <div id="share-status" class="status hidden">
          <div class="link-label">LINK</div>
          <div class="link-row">
            <input id="share-link" type="text" readonly />
            <button id="copy-link-btn" class="btn ghost">COPY</button>
          </div>
          <p class="timer"><span id="timer">00:00</span></p>
        </div>

        <div id="broadcaster-stats" class="stats"></div>
        <div id="viewer-count" class="count hidden"></div>
        <p class="hint" id="b-hint">
          clique em iniciar para compartilhar sua tela.
        </p>
      </div>
    </div>
  </div>

  <!-- CONFIG POPUP -->
  <div id="config-popup" class="popup-overlay hidden">
    <div class="popup">
      <div class="popup-header">CONFIG</div>

      <div class="config-section">
        <div class="config-label">QUALIDADE</div>
        <div class="option-row">
          <button class="option active" data-key="quality" data-value="1080">1080P</button>
          <button class="option" data-key="quality" data-value="720">720P</button>
          <button class="option" data-key="quality" data-value="480">480P</button>
        </div>
      </div>

      <div class="config-section">
        <div class="config-label">FPS</div>
        <div class="option-row">
          <button class="option" data-key="fps" data-value="60">60</button>
          <button class="option active" data-key="fps" data-value="30">30</button>
        </div>
      </div>

      <div class="popup-actions">
        <button id="config-confirm" class="btn primary">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
            <path d="M8 5v14l11-7z" />
          </svg>
          TRANSMITIR
        </button>
        <button id="config-cancel" class="btn ghost">CANCELAR</button>
      </div>
    </div>
  </div>

  <!-- SHARE POPUP -->
  <div id="share-popup" class="popup-overlay hidden">
    <div class="popup">
      <div class="popup-header">LIVE</div>
      <p class="popup-subtitle">sua tela esta sendo transmitida.</p>
      <div class="link-row">
        <input id="popup-link" type="text" readonly />
        <button id="popup-copy-btn" class="btn ghost">COPY</button>
      </div>
      <p class="timer"><span id="popup-timer">00:00</span></p>
      <div class="popup-actions">
        <button id="popup-ok-btn" class="btn primary">OK</button>
        <button id="popup-stop-btn" class="btn danger">PARAR</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
